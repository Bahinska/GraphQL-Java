server:
    port: 8080

spring:
    application:
        name: graphqlapi-client
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        defer-datasource-initialization: true
    datasource:
        url: jdbc:h2:mem:testdb
        username: sa
        password: password
        driverClassName: org.h2.Driver
    sql:
      init:
          mode: always
    h2:
        console:
            enabled: true
    graphql:
      graphiql:
          enabled: true
      schema:
         printer:
             enabled: true
             print-introspection-enabled: true


    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:9080/realms/my-realm

jwt:
    auth:
        converter:
            resource-id: ${spring.application.name}

            principal-attribute: preferred_username
logging:
    level:
        org:
            springframework:
                security: DEBUG