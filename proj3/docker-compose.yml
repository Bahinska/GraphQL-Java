version: '3.8'

services:
    keycloak:
        image: quay.io/keycloak/keycloak:26.0.7
        environment:
            - KC_BOOTSTRAP_ADMIN_USERNAME=admin
            - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
        ports:
            - "9080:8080"
        volumes:
            - keycloak_data:/opt/jboss/keycloak/standalone/data
        command: ["start-dev"]

volumes:
    keycloak_data: